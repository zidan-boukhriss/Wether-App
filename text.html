<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieSearch - Single Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ── نفس الأنماط الأصلية مع إزالة شبكة الشاشات ── */
        :root {
            --bg-dark: #070b14;
            --bg-panel: #0d1626;
            --bg-input: #162338;
            --primary: #4f8cff;
            --text-main: #f4f7fb;
            --text-muted: #8fa1b8;
            --surface-1: #0d1626;
            --surface-2: #111d30;
            --surface-3: #16243a;
            --line: rgba(148, 163, 184, 0.13);
            --primary-hover: #6a9dff;
            --shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at 10% 0%, rgba(79, 140, 255, 0.10), transparent 32rem),
                radial-gradient(circle at 90% 20%, rgba(79, 140, 255, 0.06), transparent 28rem),
                var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        #app {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .screen {
            background: linear-gradient(180deg, rgba(17, 29, 48, 0.96), rgba(10, 18, 31, 0.96));
            border-radius: 24px;
            padding: 32px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            min-height: 400px;
            overflow: hidden;
            transition: opacity 0.25s ease;
        }

        .screen-header {
            font-weight: 700;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
            color: #dce7f7;
            font-size: 0.92rem;
            letter-spacing: 0.01em;
        }

        /* ── عناصر مشتركة ── */
        .btn {
            background: linear-gradient(135deg, #5b93ff, #3b7cf4);
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(59, 124, 244, 0.22);
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .btn:hover {
            background: linear-gradient(135deg, #73a5ff, #4b88f7);
            transform: translateY(-1px);
            box-shadow: 0 11px 24px rgba(59, 124, 244, 0.30);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(79, 140, 255, 0.55);
            color: #8eb6ff;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(79, 140, 255, 0.08);
            transform: translateY(-1px);
        }

        .search-bar {
            display: flex;
            gap: 12px;
            background: rgba(22, 35, 56, 0.88);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid var(--line);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
        }
        .search-bar:focus-within {
            border-color: rgba(79, 140, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.10);
        }
        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 1rem;
        }
        .search-bar input::placeholder {
            color: #70829b;
        }

        .tag {
            background: #12213a;
            border: 1px solid rgba(148, 163, 184, 0.12);
            color: #b9c8dc;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.18s ease;
        }
        .tag:hover {
            background: #193052;
            border-color: rgba(79, 140, 255, 0.30);
            color: #e6efff;
            transform: translateY(-1px);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        .movie-card {
            background: linear-gradient(180deg, #142238, #101b2d);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            text-align: left;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.13);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }
        .movie-card:hover {
            transform: translateY(-3px);
            border-color: rgba(79, 140, 255, 0.32);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.22);
        }
        .movie-card h4 {
            color: #eef4ff;
            line-height: 1.35;
            margin-bottom: 5px;
        }
        .movie-card p {
            color: var(--text-muted);
            line-height: 1.5;
        }
        .movie-poster {
            width: 100%;
            height: 150px;
            background:
                linear-gradient(135deg, rgba(79, 140, 255, 0.08), rgba(0, 0, 0, 0.15)),
                #09111f;
            border: 1px solid rgba(148, 163, 184, 0.10);
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
        }
        .rating {
            color: #f6c85f;
        }

        .sidebar {
            width: 220px;
            background: rgba(7, 13, 24, 0.70);
            border: 1px solid var(--line);
            padding: 18px;
            border-radius: 12px;
        }
        .sidebar h4 {
            margin-bottom: 15px;
        }
        .recent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-muted);
            border-color: var(--line);
        }
        .recent-item:hover {
            color: #dce8f8;
        }
        .recent-item .remove {
            cursor: pointer;
        }

        .results-layout {
            display: flex;
            gap: 24px;
        }
        .results-layout .movie-grid {
            flex: 1;
        }

        /* ── حالات خاصة ── */
        .initial-state {
            text-align: center;
            padding-top: 20px;
        }
        .initial-state .icon {
            font-size: 50px;
            margin-bottom: 24px;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 270px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.08);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
            box-shadow: 0 0 24px rgba(79, 140, 255, 0.10);
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .error-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 270px;
            text-align: center;
        }
        .error-icon {
            font-size: 40px;
            color: #ff6575;
            margin-bottom: 15px;
            border: 2px solid rgba(255, 101, 117, 0.75);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            line-height: 60px;
            box-shadow: 0 0 25px rgba(255, 101, 117, 0.10);
        }

        .movie-details {
            display: flex;
            gap: 24px;
        }
        .poster-large {
            width: 180px;
            height: 270px;
            background:
                linear-gradient(135deg, rgba(79, 140, 255, 0.08), rgba(0, 0, 0, 0.15)),
                #09111f;
            border: 1px solid rgba(148, 163, 184, 0.10);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 14px;
        }
        .info {
            flex: 1;
        }
        .info h2 {
            margin-bottom: 10px;
        }
        .meta {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 10px;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .pagination button {
            border: 1px solid var(--line);
            background: #111f34;
            color: white;
            padding: 8px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.18s ease;
        }
        .pagination button:hover {
            background: #193052;
        }
        .pagination .active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 7px 18px rgba(79, 140, 255, 0.22);
        }

        .sidebar-full {
            background: rgba(7, 13, 24, 0.70);
            border: 1px solid var(--line);
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .sidebar-full .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--line);
        }
        .sidebar-full .item:hover {
            color: #dce8f8;
        }
        .sidebar-full .item-title {
            font-weight: 600;
        }
        .sidebar-full .item-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .mobile-view {
            max-width: 350px;
            margin: 0 auto;
            background: var(--bg-dark);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--line);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
        }
        .mobile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .mobile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* ── تجاوب ── */
        @media (max-width: 900px) {
            .screen {
                padding: 24px;
            }
            .results-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }

        @media (max-width: 700px) {
            .movie-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .movie-details {
                flex-direction: column;
                align-items: center;
            }
            .poster-large {
                width: 100%;
                max-width: 200px;
                height: 280px;
            }
            .sidebar-full {
                max-width: 100%;
            }
        }

        @media (max-width: 500px) {
            .screen {
                padding: 16px;
            }
            .search-bar {
                flex-wrap: wrap;
            }
            .search-bar input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <script>
        // ════════════════════════════════════════════════════════════
        //   دوال إنشاء المحتوى – كل دالة تعيد سلسلة HTML للشاشة
        // ════════════════════════════════════════════════════════════

        // 1. الشاشة الرئيسية (Home)
        function renderHome() {
            return `
                <div class="screen">
                    <div class="screen-header">🏠 Home</div>
                    <div class="initial-state">
                        <div class="icon">🎬</div>
                        <h2>Find Your Next Movie</h2>
                        <p>Search for movies, explore details, and discover new favorites.</p>
                        <div class="search-bar" id="homeSearchBar">
                            <input type="text" placeholder="Search for a movie..." id="homeSearchInput" />
                            <button class="btn" id="homeSearchBtn">Search</button>
                        </div>
                        <p style="margin-top:20px;font-size:14px;">Popular Searches</p>
                        <div class="popular-searches" style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;">
                            <span class="tag" data-movie="Batman">Batman</span>
                            <span class="tag" data-movie="Inception">Inception</span>
                            <span class="tag" data-movie="Spider-Man">Spider-Man</span>
                            <span class="tag" data-movie="The Matrix">The Matrix</span>
                        </div>
                        <div style="margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                            <button class="btn" id="showLoadingBtn">Show Loading</button>
                            <button class="btn" id="showErrorBtn">Show Error</button>
                            <button class="btn" id="showDetailsBtn">Show Details</button>
                            <button class="btn" id="showPaginationBtn">Show Pagination</button>
                            <button class="btn" id="showRecentBtn">Show Recent</button>
                            <button class="btn" id="showMobileBtn">Show Mobile View</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. نتائج البحث
        function renderSearchResults(query = 'batman') {
            return `
                <div class="screen">
                    <div class="screen-header">🔍 Search Results</div>
                    <div class="search-bar">
                        <input type="text" value="${query}" />
                        <button class="btn">Search</button>
                    </div>
                    <div class="results-layout">
                        <div>
                            <p style="font-size:14px;margin-bottom:15px;">10 results for "${query}"</p>
                            <div class="movie-grid">
                                <div class="movie-card"><div class="movie-poster">Poster</div><h4>Batman Begins</h4><p>2005 <br /> <span class="rating">★★★</span></p></div>
                                <div class="movie-card"><div class="movie-poster">Poster</div><h4>The Dark Knight</h4><p>2008 <br /> <span class="rating">★★★★★</span></p></div>
                                <div class="movie-card"><div class="movie-poster">Poster</div><h4>The Batman</h4><p>2022 <br /> <span class="rating">★★★★</span></p></div>
                                <div class="movie-card"><div class="movie-poster">Poster</div><h4>Batman v Superman</h4><p>2016 <br /> <span class="rating">★★★</span></p></div>
                            </div>
                        </div>
                        <div class="sidebar">
                            <h4>Recent Searches</h4>
                            <div class="recent-item"><span>🕐 ${query}</span><span class="remove">✕</span></div>
                            <div class="recent-item"><span>🕐 spiderman</span><span class="remove">✕</span></div>
                            <div class="recent-item"><span>🕐 inception</span><span class="remove">✕</span></div>
                        </div>
                    </div>
                    <div style="margin-top:20px;text-align:center;">
                        <button class="btn" id="backToHomeBtn">← Back to Home</button>
                    </div>
                </div>
            `;
        }

        // 3. حالة التحميل
        function renderLoading() {
            return `
                <div class="screen">
                    <div class="screen-header">⏳ Loading</div>
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <h3>Searching for movies...</h3>
                        <p style="color:var(--text-muted);">This might take a few seconds.</p>
                        <button class="btn" id="backToHomeBtn" style="margin-top:20px;">← Back to Home</button>
                    </div>
                </div>
            `;
        }

        // 4. حالة الخطأ
        function renderError() {
            return `
                <div class="screen">
                    <div class="screen-header">❌ Error</div>
                    <div class="error-state">
                        <div class="error-icon">!</div>
                        <h3>Something went wrong!</h3>
                        <p style="color:var(--text-muted);">We couldn't reach the servers. Please check your internet connection and try again.</p>
                        <br />
                        <button class="btn">Try Again</button>
                        <button class="btn" id="backToHomeBtn" style="margin-top:10px;">← Back to Home</button>
                    </div>
                </div>
            `;
        }

        // 5. تفاصيل الفيلم
        function renderMovieDetails() {
            return `
                <div class="screen">
                    <div class="screen-header">🎞️ Movie Details</div>
                    <div class="movie-details">
                        <div class="poster-large">Poster</div>
                        <div class="info">
                            <h2>The Batman</h2>
                            <p><span class="rating">★ 7.8/10</span> (642K)</p>
                            <p class="meta">2022 • 2h 56m • Action, Crime, Drama</p>
                            <p class="meta">Director: Matt Reeves<br />Actors: Robert Pattinson, Zoë Kravitz, Jeffrey Wright</p>
                            <p style="font-size:14px;color:var(--text-muted);">When a sadistic killer targets key political figures in Gotham, Batman uncovers a web of corruption...</p>
                            <div class="buttons">
                                <button class="btn">Add to Favorites</button>
                                <button class="btn-outline" id="backToHomeBtn">Back to results</button>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top:20px;text-align:center;">
                        <button class="btn" id="backToHomeBtn">← Back to Home</button>
                    </div>
                </div>
            `;
        }

        // 6. الترقيم
        function renderPagination() {
            return `
                <div class="screen">
                    <div class="screen-header">📄 Pagination</div>
                    <div class="movie-grid" style="margin-bottom:24px;">
                        <div class="movie-card"><div class="movie-poster">Poster</div><h4>Inception</h4><p>2010</p></div>
                        <div class="movie-card"><div class="movie-poster">Poster</div><h4>Interstellar</h4><p>2014</p></div>
                        <div class="movie-card"><div class="movie-poster">Poster</div><h4>The Matrix</h4><p>1999</p></div>
                        <div class="movie-card"><div class="movie-poster">Poster</div><h4>The Prestige</h4><p>2006</p></div>
                    </div>
                    <div class="pagination">
                        <button>← Previous</button>
                        <button>1</button>
                        <button class="active">2</button>
                        <button>3</button>
                        <button>Next →</button>
                    </div>
                    <div style="margin-top:20px;text-align:center;">
                        <button class="btn" id="backToHomeBtn">← Back to Home</button>
                    </div>
                </div>
            `;
        }

        // 7. البحث الأخير (شريط جانبي)
        function renderRecentSearches() {
            return `
                <div class="screen">
                    <div class="screen-header">🕘 Recent Searches</div>
                    <div class="sidebar-full">
                        <h3 style="margin-bottom:24px;">Recent Searches</h3>
                        <div class="item"><div><div class="item-title">batman</div><div class="item-time">Today, 10:32 AM</div></div><span class="remove" style="cursor:pointer;">✕</span></div>
                        <div class="item"><div><div class="item-title">spiderman</div><div class="item-time">Today, 09:12 AM</div></div><span class="remove" style="cursor:pointer;">✕</span></div>
                        <div class="item"><div><div class="item-title">inception</div><div class="item-time">Yesterday, 08:45 PM</div></div><span class="remove" style="cursor:pointer;">✕</span></div>
                        <div class="item"><div><div class="item-title">the matrix</div><div class="item-time">Yesterday, 06:20 PM</div></div><span class="remove" style="cursor:pointer;">✕</span></div>
                        <div class="item"><div><div class="item-title">interstellar</div><div class="item-time">Yesterday, 04:12 PM</div></div><span class="remove" style="cursor:pointer;">✕</span></div>
                        <br />
                        <button class="btn" style="width:100%;">Clear All</button>
                        <button class="btn" id="backToHomeBtn" style="width:100%;margin-top:10px;">← Back to Home</button>
                    </div>
                </div>
            `;
        }

        // 8. العرض المتجاوب (موبايل)
        function renderMobileView() {
            return `
                <div class="screen">
                    <div class="screen-header">📱 Mobile View</div>
                    <div class="mobile-view">
                        <div class="mobile-header">
                            <span>☰</span>
                            <strong>🎬 MovieSearch</strong>
                            <span>⚙️</span>
                        </div>
                        <div class="initial-state" style="padding:20px 0;">
                            <div class="search-bar"><input type="text" placeholder="Search..." /><button class="btn">🔍</button></div>
                            <p style="font-size:14px;margin-bottom:10px;">Popular Searches</p>
                            <div class="popular-searches" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                                <span class="tag">Batman</span>
                                <span class="tag">Inception</span>
                            </div>
                        </div>
                        <div class="mobile-grid">
                            <div class="movie-card"><div class="movie-poster">Poster</div><h4>Batman</h4></div>
                            <div class="movie-card"><div class="movie-poster">Poster</div><h4>Inception</h4></div>
                            <div class="movie-card"><div class="movie-poster">Poster</div><h4>Matrix</h4></div>
                            <div class="movie-card"><div class="movie-poster">Poster</div><h4>Interstellar</h4></div>
                        </div>
                    </div>
                    <div style="margin-top:20px;text-align:center;">
                        <button class="btn" id="backToHomeBtn">← Back to Home</button>
                    </div>
                </div>
            `;
        }

        // ════════════════════════════════════════════════════════════
        //   إدارة العرض – دالة تغيير الشاشة
        // ════════════════════════════════════════════════════════════

        const app = document.getElementById('app');

        function showScreen(renderFn) {
            app.innerHTML = renderFn();
            // إعادة ربط الأحداث بعد تحديث DOM
            attachEventListeners();
        }

        // دالة ربط الأحداث (يتم استدعاؤها بعد كل عرض)
        function attachEventListeners() {
            // زر العودة إلى الرئيسية (موجود في عدة شاشات)
            document.querySelectorAll('#backToHomeBtn').forEach(btn => {
                btn.addEventListener('click', () => showScreen(renderHome));
            });

            // زر البحث في الشاشة الرئيسية
            const searchBtn = document.getElementById('homeSearchBtn');
            const searchInput = document.getElementById('homeSearchInput');
            if (searchBtn && searchInput) {
                const doSearch = () => {
                    const query = searchInput.value.trim() || 'batman';
                    showScreen(() => renderSearchResults(query));
                };
                searchBtn.addEventListener('click', doSearch);
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') doSearch();
                });
            }

            // الكلمات المفتاحية الشائعة (tags)
            document.querySelectorAll('.tag[data-movie]').forEach(tag => {
                tag.addEventListener('click', (e) => {
                    const movie = e.target.dataset.movie;
                    showScreen(() => renderSearchResults(movie));
                });
            });

            // أزرار التنقل السريع من الرئيسية
            const loadingBtn = document.getElementById('showLoadingBtn');
            if (loadingBtn) loadingBtn.addEventListener('click', () => showScreen(renderLoading));

            const errorBtn = document.getElementById('showErrorBtn');
            if (errorBtn) errorBtn.addEventListener('click', () => showScreen(renderError));

            const detailsBtn = document.getElementById('showDetailsBtn');
            if (detailsBtn) detailsBtn.addEventListener('click', () => showScreen(renderMovieDetails));

            const paginationBtn = document.getElementById('showPaginationBtn');
            if (paginationBtn) paginationBtn.addEventListener('click', () => showScreen(renderPagination));

            const recentBtn = document.getElementById('showRecentBtn');
            if (recentBtn) recentBtn.addEventListener('click', () => showScreen(renderRecentSearches));

            const mobileBtn = document.getElementById('showMobileBtn');
            if (mobileBtn) mobileBtn.addEventListener('click', () => showScreen(renderMobileView));
        }

        // ── عرض الشاشة الرئيسية عند التحميل ──
        showScreen(renderHome);
    </script>
